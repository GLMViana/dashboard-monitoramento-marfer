<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Treino</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; manifest-src 'self'; connect-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#050505" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Treino">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>
</head>
<body>
<main id="app">
  <div id="banner"></div>
  <div id="view"></div>
</main>

<div id="rest" hidden></div>

<nav id="nav" aria-label="Navegação">
  <button data-act="tab" data-tab="hoje" aria-label="Hoje">
    <svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg><span>Hoje</span>
  </button>
  <button data-act="tab" data-tab="fichas" aria-label="Fichas">
    <svg viewBox="0 0 24 24"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg><span>Fichas</span>
  </button>
  <button data-act="tab" data-tab="evolucao" aria-label="Evolução">
    <svg viewBox="0 0 24 24"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg><span>Evolução</span>
  </button>
  <button data-act="tab" data-tab="historico" aria-label="Histórico">
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><span>Histórico</span>
  </button>
  <button data-act="tab" data-tab="perfil" aria-label="Perfil">
    <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>Perfil</span>
  </button>
</nav>

<div id="sheet" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<datalist id="exlist"></datalist>
<input type="file" id="file" accept=".json,application/json" hidden>
<noscript><p style="padding:24px;font-family:sans-serif">Ative o JavaScript para usar o app de treino.</p></noscript>
<script src="app.js"></script>
</body>
</html>
